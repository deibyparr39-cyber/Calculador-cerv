<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Cuenta de Cervezas</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef2f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827}
.app{max-width:520px;margin:auto;padding:14px}
h1{text-align:center;font-size:26px;margin:8px 0 3px}.sub{text-align:center;color:#64748b;margin-bottom:15px}
.card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 4px 18px #0001}
.row{padding:15px 0;border-bottom:1px solid #e5e7eb}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.name{font-size:18px;font-weight:800}.price{font-weight:700;color:#64748b}
.bottom{display:flex;align-items:center;margin-top:12px}
.pm{width:54px;height:50px;border:0;border-radius:13px;background:#e2e8f0;font-size:28px;font-weight:800}
.qty{min-width:55px;text-align:center;font-size:22px;font-weight:900}
.subtotal{margin-left:auto;font-size:17px;font-weight:800}
.total{display:flex;justify-content:space-between;align-items:center;padding:22px 0;font-size:28px;font-weight:900}
.total span:last-child{font-size:32px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions button{border:0;border-radius:13px;padding:15px;font-size:16px;font-weight:800}
.new{background:#e2e8f0}.pay{background:#16a34a;color:white}
.detail{margin-top:14px;background:white;border-radius:18px;padding:15px;box-shadow:0 3px 12px #0001}
.detail h2{margin:0 0 8px;font-size:18px}.empty{color:#94a3b8;text-align:center}

html {
  width: 100%;
  min-height: 100%;
  overflow-x: hidden;
  touch-action: manipulation;
  -ms-touch-action: manipulation;
  -webkit-text-size-adjust: 100%;
}
body {
  width: 100%;
  min-height: 100%;
  overflow-x: hidden;
  touch-action: manipulation;
  overscroll-behavior-x: none;
  -webkit-user-select: none;
  user-select: none;
}
button {
  touch-action: manipulation;
  -webkit-appearance: none;
  appearance: none;
}
input, textarea, select {
  font-size: 16px !important;
}


.qtyInput{width:58px;min-width:58px;height:50px;border:0;background:transparent;text-align:center;font-size:22px !important;font-weight:900;color:#111827;padding:0;outline:none;-webkit-appearance:none;appearance:none}
.qtyInput::-webkit-inner-spin-button,.qtyInput::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
</style>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

</head>
<body>
<div class="app">
<h1>🍺 Cuenta</h1>
<div class="sub">Toca + para agregar y − para quitar</div>
<div class="card">

<div class="row"><div class="top"><span class="name">Águila / Poker</span><span class="price">$3.000</span></div>
<div class="bottom"><button class="pm" onclick="change(0,-1)">−</button><input class="qtyInput" id="q0" type="number" inputmode="numeric" min="0" step="1" value="" aria-label="Cantidad"><button class="pm" onclick="change(0,1)">+</button><span class="subtotal" id="s0">$0</span></div></div>

<div class="row"><div class="top"><span class="name">Águila Light</span><span class="price">$3.500</span></div>
<div class="bottom"><button class="pm" onclick="change(1,-1)">−</button><input class="qtyInput" id="q1" type="number" inputmode="numeric" min="0" step="1" value="" aria-label="Cantidad"><button class="pm" onclick="change(1,1)">+</button><span class="subtotal" id="s1">$0</span></div></div>

<div class="row"><div class="top"><span class="name">Coronita</span><span class="price">$5.000</span></div>
<div class="bottom"><button class="pm" onclick="change(2,-1)">−</button><input class="qtyInput" id="q2" type="number" inputmode="numeric" min="0" step="1" value="" aria-label="Cantidad"><button class="pm" onclick="change(2,1)">+</button><span class="subtotal" id="s2">$0</span></div></div>

<div class="row"><div class="top"><span class="name">Club Colombia</span><span class="price">$4.000</span></div>
<div class="bottom"><button class="pm" onclick="change(3,-1)">−</button><input class="qtyInput" id="q3" type="number" inputmode="numeric" min="0" step="1" value="" aria-label="Cantidad"><button class="pm" onclick="change(3,1)">+</button><span class="subtotal" id="s3">$0</span></div></div>

<div class="total"><span>TOTAL</span><span id="total">$0</span></div>
<div class="actions"><button class="new" onclick="reset()">🆕 Nueva cuenta</button><button class="pay" onclick="pay()">💰 Cobrar</button></div>
</div>

<div class="detail"><h2>Detalle</h2><div id="detail" class="empty">Toca + para comenzar.</div></div>
</div>


<script>
(function () {
  // Prevent Safari gesture-based scaling.
  ['gesturestart','gesturechange','gestureend'].forEach(function(type) {
    document.addEventListener(type, function(e) {
      e.preventDefault();
    }, {passive:false});
  });

  // Prevent pinch zoom via multi-touch.
  document.addEventListener('touchstart', function(e) {
    if (e.touches.length > 1) e.preventDefault();
  }, {passive:false});

  document.addEventListener('touchmove', function(e) {
    if (e.touches.length > 1) e.preventDefault();
  }, {passive:false});

  // Prevent iOS double-tap zoom.
  var lastTouchEnd = 0;
  document.addEventListener('touchend', function(e) {
    var now = Date.now();
    if (now - lastTouchEnd <= 350) {
      e.preventDefault();
    }
    lastTouchEnd = now;
  }, {passive:false});

  // Keep the visual viewport at scale 1 when Safari changes it.
  function lockViewport() {
    if (window.visualViewport && window.visualViewport.scale > 1) {
      var x = window.scrollX;
      var y = window.scrollY;
      window.scrollTo(x, y);
    }
  }

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', lockViewport);
    window.visualViewport.addEventListener('scroll', lockViewport);
  }
})();
</script>

<script>
const prices=[3000,3500,5000,4000];
const names=["Águila / Poker","Águila Light","Coronita","Club Colombia"];
let qty=[0,0,0,0];

function money(n){return "$"+n.toLocaleString("es-CO")}
function change(i,d){
  qty[i]=Math.max(0,qty[i]+d);
  render();
}
function render(){
  let total=0, lines=[];
  for(let i=0;i<4;i++){
    const sub=qty[i]*prices[i];
    total+=sub;
    document.getElementById("q"+i).value = qty[i] === 0 ? "" : qty[i];
    document.getElementById("s"+i).textContent=qty[i] ? money(sub) : "$0";
    if(qty[i]) lines.push(qty[i]+" × "+names[i]+" = "+money(sub));
  }
  document.getElementById("total").textContent=money(total);
  const d=document.getElementById("detail");
  d.className=lines.length?"":"empty";
  d.innerHTML=lines.length?lines.join("<br>"):"Toca + para comenzar.";
}
function updateTotals(){
  let total=0, lines=[];
  for(let i=0;i<4;i++){
    const sub=qty[i]*prices[i];
    total+=sub;
    if(qty[i]) lines.push(qty[i]+" × "+names[i]+" = "+money(sub));
  }
  document.getElementById("total").textContent=money(total);
  const d=document.getElementById("detail");
  d.className=lines.length?"":"empty";
  d.innerHTML=lines.length?lines.join("<br>"):"Toca + para comenzar.";
}
function reset(){qty=[0,0,0,0];render()}
function pay(){
  const total=qty.reduce((sum,q,i)=>sum+q*prices[i],0);
  if(total===0){alert("Agrega productos primero.");return}
  alert("TOTAL A COBRAR: "+money(total));
  reset();
}

render();

for(let i=0;i<4;i++){
  const input=document.getElementById("q"+i);
  input.addEventListener("input",function(){
    if(this.value.trim()===""){
      qty[i]=0;
    } else {
      let value=parseInt(this.value,10);
      if(isNaN(value)||value<0)value=0;
      qty[i]=value;
    }
    updateTotals();
  });
  input.addEventListener("focus",function(){ this.select(); });
}
</script>
</body>
</html>
