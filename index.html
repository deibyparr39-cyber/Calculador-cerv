<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Cuenta de Cervezas</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  width:100%;
  overflow-x:hidden;
  -webkit-text-size-adjust:100%;
}
body{
  background:#eef2f7;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#111827;
}
.app{max-width:520px;margin:auto;padding:14px}
h1{text-align:center;font-size:26px;margin:8px 0 3px}
.sub{text-align:center;color:#64748b;margin-bottom:15px}
.card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 4px 18px #0001}
.row{padding:15px 0;border-bottom:1px solid #e5e7eb}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.name{font-size:18px;font-weight:800}
.price{font-weight:700;color:#64748b}
.bottom{display:flex;align-items:center;margin-top:12px;gap:4px}
.pm{
  width:54px;height:50px;border:0;border-radius:13px;
  background:#e2e8f0;font-size:28px;font-weight:800;
  touch-action:manipulation;
}
.qtyInput{
  width:70px;height:50px;border:0;background:transparent;
  text-align:center;font-size:22px!important;font-weight:900;
  color:#111827;outline:none;padding:0;
  -webkit-appearance:none;appearance:none;
  -webkit-user-select:text;user-select:text;
  touch-action:manipulation;
}
.qtyInput::-webkit-inner-spin-button,
.qtyInput::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.subtotal{margin-left:auto;font-size:17px;font-weight:800}
.total{display:flex;justify-content:space-between;align-items:center;padding:22px 0;font-size:28px;font-weight:900}
.total span:last-child{font-size:32px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions button{border:0;border-radius:13px;padding:15px;font-size:16px;font-weight:800}
.new{background:#e2e8f0}.pay{background:#16a34a;color:white}
.detail{margin-top:14px;background:white;border-radius:18px;padding:15px;box-shadow:0 3px 12px #0001}
.detail h2{margin:0 0 8px;font-size:18px}
.empty{color:#94a3b8;text-align:center}
</style>
</head>
<body>
<div class="app">
<h1>🍺 Cuenta</h1>
<div class="sub">Escribe la cantidad o usa + y −</div>
<div class="card">

<div class="row">
<div class="top"><span class="name">Águila / Poker</span><span class="price">$3.000</span></div>
<div class="bottom">
<button class="pm" type="button" onclick="change(0,-1)">−</button>
<input class="qtyInput" id="q0" type="number" inputmode="numeric" min="0" step="1" placeholder="" aria-label="Cantidad Águila Poker">
<button class="pm" type="button" onclick="change(0,1)">+</button>
<span class="subtotal" id="s0">$0</span>
</div>
</div>

<div class="row">
<div class="top"><span class="name">Águila Light</span><span class="price">$3.500</span></div>
<div class="bottom">
<button class="pm" type="button" onclick="change(1,-1)">−</button>
<input class="qtyInput" id="q1" type="number" inputmode="numeric" min="0" step="1" placeholder="" aria-label="Cantidad Águila Light">
<button class="pm" type="button" onclick="change(1,1)">+</button>
<span class="subtotal" id="s1">$0</span>
</div>
</div>

<div class="row">
<div class="top"><span class="name">Coronita</span><span class="price">$5.000</span></div>
<div class="bottom">
<button class="pm" type="button" onclick="change(2,-1)">−</button>
<input class="qtyInput" id="q2" type="number" inputmode="numeric" min="0" step="1" placeholder="" aria-label="Cantidad Coronita">
<button class="pm" type="button" onclick="change(2,1)">+</button>
<span class="subtotal" id="s2">$0</span>
</div>
</div>

<div class="row">
<div class="top"><span class="name">Club Colombia</span><span class="price">$4.000</span></div>
<div class="bottom">
<button class="pm" type="button" onclick="change(3,-1)">−</button>
<input class="qtyInput" id="q3" type="number" inputmode="numeric" min="0" step="1" placeholder="" aria-label="Cantidad Club Colombia">
<button class="pm" type="button" onclick="change(3,1)">+</button>
<span class="subtotal" id="s3">$0</span>
</div>
</div>

<div class="total"><span>TOTAL</span><span id="total">$0</span></div>
<div class="actions">
<button class="new" type="button" onclick="reset()">🆕 Nueva cuenta</button>
<button class="pay" type="button" onclick="pay()">💰 Cobrar</button>
</div>
</div>

<div class="detail">
<h2>Detalle</h2>
<div id="detail" class="empty">Toca + o escribe una cantidad.</div>
</div>
</div>

<script>
const prices=[3000,3500,5000,4000];
const names=["Águila / Poker","Águila Light","Coronita","Club Colombia"];
let qty=[0,0,0,0];

function money(n){
  return "$"+n.toLocaleString("es-CO");
}

function change(i,d){
  qty[i]=Math.max(0,qty[i]+d);
  updateRow(i);
  updateTotal();
}

function updateRow(i){
  const input=document.getElementById("q"+i);
  input.value=qty[i]===0?"":String(qty[i]);

  const sub=qty[i]*prices[i];
  document.getElementById("s"+i).textContent=qty[i]?money(sub):"$0";
}

function updateTotal(){
  let total=0;
  let lines=[];

  for(let i=0;i<4;i++){
    const sub=qty[i]*prices[i];
    total+=sub;
    if(qty[i]) lines.push(qty[i]+" × "+names[i]+" = "+money(sub));
  }

  document.getElementById("total").textContent=money(total);

  const detail=document.getElementById("detail");
  detail.className=lines.length?"":"empty";
  detail.innerHTML=lines.length?lines.join("<br>"):"Toca + o escribe una cantidad.";
}

function reset(){
  qty=[0,0,0,0];
  for(let i=0;i<4;i++) updateRow(i);
  updateTotal();
}

function pay(){
  const total=qty.reduce((sum,q,i)=>sum+q*prices[i],0);
  if(total===0){
    alert("Agrega productos primero.");
    return;
  }
  alert("TOTAL A COBRAR: "+money(total));
  reset();
}

// Escribir directamente la cantidad sin redibujar el campo.
for(let i=0;i<4;i++){
  const input=document.getElementById("q"+i);

  input.addEventListener("input",function(){
    const value=this.value.trim();

    if(value===""){
      qty[i]=0;
    }else{
      const n=parseInt(value,10);
      qty[i]=Number.isFinite(n) && n>=0 ? n : 0;
    }

    const sub=qty[i]*prices[i];
    document.getElementById("s"+i).textContent=qty[i]?money(sub):"$0";
    updateTotal();
  });

  input.addEventListener("keydown",function(e){
    if(e.key==="Enter") this.blur();
  });
}

// Bloqueo de zoom de Safari.
["gesturestart","gesturechange","gestureend"].forEach(function(type){
  document.addEventListener(type,function(e){e.preventDefault();},{passive:false});
});

let lastTouchEnd=0;
document.addEventListener("touchend",function(e){
  const now=Date.now();
  if(now-lastTouchEnd<300 && e.target.closest("button")){
    e.preventDefault();
  }
  lastTouchEnd=now;
},{passive:false});

document.addEventListener("touchmove",function(e){
  if(e.touches.length>1) e.preventDefault();
},{passive:false});

for(let i=0;i<4;i++) updateRow(i);
updateTotal();
</script>
</body>
</html>
